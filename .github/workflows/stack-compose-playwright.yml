name: Stack Compose + Playwright (Unified)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fails a PR that commits a credential going forward (issue #135). Scans the
  # committed working tree (not git history — a history rewrite of the previously
  # leaked value is a separate operator decision) with gitleaks + .gitleaks.toml.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks (committed working tree)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1 --verbose

  validate-stack:
    runs-on: ubuntu-latest
    # issue #23 follow-up, 2026-08-07 (revised same day after a qodo bot review
    # caught a math error in the first revision): this budget is derived, not
    # picked. It has to cover the "Wait for services to be ready" step's own
    # wall-clock budget (now deadline-based, see that step) plus every other
    # step around it:
    #   - readiness deadlines: Chatwoot 300s + Dify 1200s + Middleware 150s
    #     = 1650s = 27.5 min. These are now real deadlines (SECONDS-based
    #     loops, not attempt counts), so this is the true worst case for that
    #     step regardless of how slow/fast each curl+sleep cycle runs on a
    #     contended runner — the previous revision of this PR sized the
    #     timeout off the *nominal* 240-attempt/5s figure (20 min) without
    #     accounting for the fact that our own measurement (15 nominal min
    #     that took ~30 real min under contention) means an attempt-count loop
    #     has no fixed wall-clock bound at all.
    #   - Checkout/Setup Node/Install deps/Build images/Start Stack/Sync
    #     tenants/Stage 1/Stage 4/Teardown: measured ~220s (3.7 min) combined
    #     on a fast run (run 92880871238); budgeted generously at 15 min to
    #     absorb slower npm/playwright-install/docker-build under the same
    #     runner contention this whole investigation is about.
    #   27.5 + 15 = 42.5 min, rounded up to 45 for a clean number with a
    #   little extra headroom.
    timeout-minutes: 45
    # Compose v2.30+ on ubuntu-latest forbids redefining services imported via
    # `include:`. The root docker-compose.yml carries cross-stack `depends_on`
    # overrides, so we chain compose files via -f / COMPOSE_FILE instead.
    env:
      # deploy/docker-compose.ci.yml re-publishes grafana on host 3002 for CI
      # only (the shared docker-compose.yml drops that publish to avoid a host
      # port collision on the shared prod host — see #113). CI's Stage 1 probes
      # grafana at 127.0.0.1:3002.
      COMPOSE_FILE: deploy/docker-compose.shared.yml:deploy/docker-compose.chatwoot.yml:deploy/docker-compose.dify.yml:deploy/docker-compose.nexaduo.yml:docker-compose.yml:deploy/docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: onboarding/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd onboarding && npm ci
          npx playwright install --with-deps chromium

      - name: Prepare .env for CI
        run: |
          cat > .env <<EOF
          COMPOSE_PROJECT_NAME=nexaduo
          TZ=UTC
          ADMIN_EMAIL=alexandre@nexaduo.com
          ADMIN_PASSWORD=AdminPass123!
          NEXADUO_CONF_PATH=${{ github.workspace }}
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          REDIS_PASSWORD=redis
          CHATWOOT_SECRET_KEY_BASE=$(openssl rand -hex 32)
          CHATWOOT_FRONTEND_URL=http://127.0.0.1:3000
          DIFY_SECRET_KEY=$(openssl rand -hex 32)
          DIFY_SANDBOX_API_KEY=dummy-key
          DIFY_PLUGIN_DAEMON_KEY=dummy-key
          DIFY_PLUGIN_DIFY_INNER_API_KEY=dummy-key
          DIFY_CONSOLE_API_URL=http://127.0.0.1:5001
          DIFY_CONSOLE_WEB_URL=http://127.0.0.1:3001
          DIFY_APP_API_URL=http://127.0.0.1:5001
          MIDDLEWARE_IMAGE=ghcr.io/nexaduo/middleware:latest
          SELF_HEALING_IMAGE=ghcr.io/nexaduo/self-healing-agent:latest
          HANDOFF_SHARED_SECRET=ci-dummy-handoff-secret-32
          GRAFANA_ADMIN_PASSWORD=AdminPass123!
          GOOGLE_OAUTH_CLIENT_ID=dummy-id
          GOOGLE_OAUTH_CLIENT_SECRET=dummy-secret
          EOF

      - name: Build local images
        run: |
          docker build -t ghcr.io/nexaduo/middleware:latest ./middleware
          docker build -t ghcr.io/nexaduo/self-healing-agent:latest ./agents/self-healing

      - name: Start Stack
        # cloudflared is in deploy/docker-compose.shared.yml; we scale it to 0
        # because CI doesn't have a tunnel token to register. COMPOSE_FILE is
        # set at job level so logs/down steps see the same chain.
        #
        # autoheal (issue #41) is also scaled to 0 in CI: on the constrained
        # 2-core runner Dify's Alembic migrations can take up to ~15 min (issue
        # #23), which would eventually trip dify-api's healthcheck and let
        # autoheal restart it mid-migration, looping the boot. CI already has its
        # own explicit readiness wait loop below, so it does not need autoheal.
        run: |
          docker network create nexaduo-network || true
          docker compose up -d --remove-orphans --scale cloudflared=0 --scale autoheal=0

      - name: Wait for services to be ready
        # chatwoot-rails starts only after chatwoot-init exits (~80s). The
        # container starts immediately but Rails needs ~30s more to boot.
        # Poll until localhost:3000 returns a non-empty HTTP response.
        # Dify and Middleware also need time for migrations and boot.
        #
        # issue #23 follow-up, 2026-08-07: these loops used to count attempts
        # (e.g. "240 x 5s = 20 min"), which is only a real wall-clock bound if
        # every curl+sleep cycle actually takes ~5s. Our own evidence says it
        # doesn't: on a contended runner a 180-attempt/5s (nominally 15 min)
        # loop took ~30 min of wall time to exhaust (each cycle ran at ~10s,
        # not 5s), because `curl --max-time 5` itself can burn its full
        # timeout under CPU starvation. An attempt-count loop therefore has NO
        # fixed wall-clock ceiling, which both undermines the timeout math
        # above (a bot review caught this in the first revision of this PR)
        # and, worse, risks the *job* timeout killing the step before its own
        # `::error::` fires — losing "Capture logs on failure" and Teardown
        # exactly when the flake happens. Switched to real elapsed-time
        # deadlines (bash `SECONDS`) so each loop's wall-clock budget is what
        # it says, independent of per-request latency. `--connect-timeout 3`
        # is added alongside `--max-time 5` so a hung TCP handshake can't
        # silently eat the whole per-request timeout either.
        run: |
          echo "Waiting for Chatwoot Rails (127.0.0.1:3000)..."
          chatwoot_deadline=300  # 5 min
          start=$SECONDS
          while true; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 http://127.0.0.1:3000/ 2>/dev/null || echo "000")
            elapsed=$((SECONDS - start))
            echo "  t+${elapsed}s/${chatwoot_deadline}s: 127.0.0.1:3000 -> ${code}"
            case "${code}" in 2*|3*|4*) echo "Chatwoot ready."; break ;; esac
            (( elapsed >= chatwoot_deadline )) && break
            sleep 5
          done
          [[ "${code}" =~ ^[234] ]] || { echo "::error::Chatwoot did not become ready in time."; exit 1; }

          # Dify runs dozens of Alembic migrations on boot and competes for the
          # runner's limited CPU/RAM, so it can take a while. issue #23
          # originally allowed 15 min. Raised to 20 min on 2026-08-07 after an
          # investigation (issue #157/#158 PRs, see PR discussion) found this
          # is a pre-existing, purely runner-contention flake unrelated to
          # those PRs' mem/cpu limits or healthchecks: the identical timeout
          # reproduced on a commit that predates both, with dify-api never
          # OOM-killed/restarted (docker ps showed it simply still
          # mid-migration and "unhealthy" at the deadline), and an immediate
          # rerun of the exact same commit passed with Dify ready on the very
          # first poll. The underlying variance is GitHub-hosted shared-runner
          # noisy-neighbor CPU steal, not something this repo's compose files
          # control. This reduces (does not eliminate) the flake rate; a
          # rerun remains the correct response if it still times out (tracked
          # in issue #23).
          echo "Waiting for Dify API (127.0.0.1:5001)..."
          dify_deadline=1200  # 20 min
          start=$SECONDS
          while true; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 http://127.0.0.1:5001/console/api/setup 2>/dev/null || echo "000")
            elapsed=$((SECONDS - start))
            echo "  t+${elapsed}s/${dify_deadline}s: 127.0.0.1:5001 -> ${code}"
            case "${code}" in 2*|3*|4*) echo "Dify API ready."; break ;; esac
            (( elapsed >= dify_deadline )) && break
            sleep 5
          done
          [[ "${code}" =~ ^[234] ]] || { echo "::error::Dify API did not become ready in time."; exit 1; }

          echo "Waiting for Middleware (/health at 127.0.0.1:4000)..."
          middleware_deadline=150  # 2.5 min
          start=$SECONDS
          while true; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 http://127.0.0.1:4000/health 2>/dev/null || echo "000")
            elapsed=$((SECONDS - start))
            echo "  t+${elapsed}s/${middleware_deadline}s: 127.0.0.1:4000/health -> ${code}"
            [[ "${code}" == "200" ]] && { echo "Middleware ready."; break; }
            (( elapsed >= middleware_deadline )) && break
            sleep 5
          done
          [[ "${code}" == "200" ]] || { echo "::error::Middleware did not become ready in time."; exit 1; }

      - name: Sync tenants to CI database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/middleware
          SKIP_GCP_SYNC: 'true'
        run: npm run tenants:sync

      - name: Stage 1 - Infrastructure Health
        working-directory: onboarding
        env:
          CHATWOOT_URL: http://127.0.0.1:3000
          DIFY_URL: http://127.0.0.1:3001
          DIFY_API_URL: http://127.0.0.1:5001
          GRAFANA_URL: http://127.0.0.1:3002
        run: npx playwright test tests/01-infra.spec.ts

      # NOTE: Stage 2 and 3 (UI Onboarding/Smoke) are currently skipped in CI 
      # due to high resource usage of Dify/Chatwoot UI in 2-core runners.
      # They are verified via Stage 1 (Connectivity) and Stage 4 (Logical Resolution).

      - name: Stage 4 - Hybrid Tenant Resolution
        working-directory: onboarding
        env:
          MIDDLEWARE_URL: http://127.0.0.1:4000
          HANDOFF_SHARED_SECRET: ci-dummy-handoff-secret-32
        run: npx playwright test tests/07-hybrid-tenants.spec.ts

      - name: Capture logs on failure
        # if: always() (not failure()) since 2026-08-07 (issue #23 follow-up):
        # a job-level timeout cancellation does not satisfy failure() in
        # GitHub Actions, so if the readiness-wait deadlines above ever run
        # long enough to hit the job's own timeout-minutes, failure() would
        # skip this step and Teardown both — losing exactly the diagnostic
        # evidence needed to tell a hard cancellation apart from a clean
        # `::error::` exit. always() runs it either way; Teardown already
        # used always() before this change.
        if: always()
        run: |
          docker compose logs --tail=100
          docker ps -a

      - name: Teardown
        if: always()
        run: docker compose down -v
