receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  # Batch traces before export to Tempo to reduce request overhead and memory
  # churn on the 16GB VM. Defaults are conservative.
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

# health_check extension (issue #158): the otelcol-contrib image is
# distroless — no shell/curl/wget inside it for a Docker-native
# `healthcheck:` to exec (verified: every exec attempt fails with
# "executable file not found"). This exposes a real :13133/health HTTP
# endpoint on chat-network instead; health-check-all.sh probes it from a
# sibling container that does have curl/wget, so a wedged collector is
# still detected even without a Docker `(healthy)` status on this one
# service.
extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

exporters:
  # Dify (and any OTLP-metrics source) → Prometheus scrape endpoint on :8889.
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: dify
    send_timestamps: true
  # Node-app traces (middleware, self-healing-agent) → Tempo via OTLP/gRPC.
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true
  # Low-noise debug exporter; kept for troubleshooting only.
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
