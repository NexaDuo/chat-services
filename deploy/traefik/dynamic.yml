# =============================================================================
# deploy/traefik/dynamic.yml — Traefik FILE-PROVIDER fallback routes.
#
# Primary routing for the host-local production runtime is the Traefik Docker
# provider (labels on the app services; see deploy/docker-compose.localproxy.yml).
# This file provider runs ALONGSIDE it at all times, as an intentional fallback
# safety net — it is not a workaround for a currently-known-bad Docker provider.
#
# Issue #151 (2026-08-06): the Docker provider was found permanently down
# ("Error response from daemon: \"\"", retried forever) because of a Docker API
# version-negotiation bug in traefik:v3.4.5 against Docker Engine 29.x — see the
# root-cause comment on the `coolify-proxy` service in
# deploy/docker-compose.localproxy.yml. Routing survived ONLY because this file
# mirrored the labels, which is exactly the risk documented below: it silently
# masked a fully dead provider for weeks (68k+ retried-forever error lines,
# 2026-07-08..07-14) until a user-reported Docker Desktop console error
# surfaced it. The image pin fix restores the Docker provider as the verified,
# actually-serving source (proof: `--api=true` on an internal-only entrypoint,
# see the compose file) — this file stays mounted as defense in depth, not as
# the thing routing depends on. Do not let it go stale: keep it in sync with
# deploy/docker-compose.{chatwoot,dify,nexaduo}.yml labels, and periodically
# verify (per the SRE audit skill) that the Docker provider, not this file, is
# the one actually serving routes.
#
# These routes mirror the committed traefik.* labels 1:1. Service hostnames
# (container DNS names on nexaduo-network) and ports match the compose files.
# =============================================================================
http:
  routers:
    chatwoot:
      rule: "Host(`chat.nexaduo.com`)"
      entrypoints: http
      service: chatwoot
    # Dify path split: /v1, /console/api, /api, /files routed to the API
    # backend at a higher priority than the web UI catch-all.
    dify-api:
      rule: "Host(`dify.nexaduo.com`) && (PathPrefix(`/v1`) || PathPrefix(`/console/api`) || PathPrefix(`/api`) || PathPrefix(`/files`))"
      entrypoints: http
      priority: 20
      service: dify-api
    dify:
      rule: "Host(`dify.nexaduo.com`)"
      entrypoints: http
      priority: 10
      service: dify
    evolution:
      rule: "Host(`evolution.nexaduo.com`)"
      entrypoints: http
      service: evolution
    middleware:
      rule: "Host(`middleware.nexaduo.com`)"
      entrypoints: http
      service: middleware
    grafana:
      rule: "Host(`grafana.nexaduo.com`)"
      entrypoints: http
      service: grafana

  services:
    chatwoot:
      loadBalancer:
        servers:
          - url: "http://chatwoot-rails:3000"
    dify-api:
      loadBalancer:
        servers:
          - url: "http://dify-api:5001"
    dify:
      loadBalancer:
        servers:
          - url: "http://dify-web:3000"
    evolution:
      loadBalancer:
        servers:
          - url: "http://evolution-api:8080"
    middleware:
      loadBalancer:
        servers:
          - url: "http://middleware:4000"
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
