# Issue #156: bounded logging is now the DEFAULT for every service, not a
# per-service afterthought (the failure mode #151/#153 fixed only for
# coolify-proxy). YAML anchors are resolved per-file at parse time — Compose
# merges the *parsed* configs of each `-f` file, so an anchor defined in one
# compose file is NOT visible from another (verified empirically: referencing
# a cross-file anchor throws "unknown anchor referenced"). Each compose file
# that defines services therefore carries its OWN copy of this
# `x-logging`/`&default-logging` block; every service in the file references
# it with `logging: *default-logging` — one line, not a copied 5-line block.
# Adding a new service to this file means the same one-line opt-in; forgetting
# it is now the only way to regress, and the health-check-all.sh assertion
# (issue #156) catches that class of gap automatically.
#
# Sizing: 10m x 3 files = 30MB/service. This mirrors the already-proven
# coolify-proxy pattern (deploy/docker-compose.localproxy.yml, #151/#153) and
# comfortably covers this file's low-volume services (postgres/redis/
# cloudflared/autoheal measured at 200-2,000 lines/15h in the #156 audit).
# Loki (via Promtail, which streams container logs continuously and is
# unaffected by local rotation — see docker-compose.chatwoot.yml for the
# noisy-tier override and rationale) retains the full searchable history
# regardless of this local on-disk buffer size.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Issue #157: mem_limit is deliberately NOT set on postgres in this file/PR.
# It holds the SACRED chat-services_postgres-data volume and a limit sized
# below what shared_buffers/work_mem can demand OOM-kills the DB under load —
# AGENTS.md/the issue both require postgres to get its own change with its
# own validation, not be folded into this bulk sweep. Every other service in
# this file gets mem_limit below.
#
# Sizing method (issue #157): measured via `docker stats --no-stream` across
# two samples ~ (2026-08-07, live host, 22 vCPU / 31GB RAM, 22 containers,
# stack up ~15-24h, zero OOM kills/restarts at baseline). Limit = ceil(4x
# measured RSS to the next 128MiB) for steady-state services — the 3-4x
# headroom multiple the issue asks for, rounded up for a "clean" number
# rather than an invented round figure. A 128MiB floor is applied to tiny
# idle services (autoheal/cloudflared) so a legitimate transient allocation
# (glibc arena growth, TLS handshake buffers, etc.) doesn't get OOM-killed
# over a baseline that was only ever measured in the single digits of MiB.
# Verified which Compose attribute actually takes effect on this host rather
# than assumed (issue's own instruction): both top-level `mem_limit` and
# `deploy.resources.limits.memory` were empirically confirmed to set
# HostConfig.Memory under `docker compose up` on this host's Compose v5.3.1 /
# Docker 29.7.1 (a disposable two-service test compose file, inspected via
# `docker inspect -f '{{.HostConfig.Memory}}'` on both, both non-zero) — this
# repo standardizes on top-level `mem_limit`/`cpus` anyway per the issue's own
# preference, since it doesn't rely on a Compose version new enough to
# translate `deploy.resources` outside Swarm.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    # NOTE (issue #156): the line above IS committed (a from-scratch bootstrap
    # must produce a compliant postgres container), but the LIVE production
    # container has deliberately NOT been recreated to pick it up in this PR.
    # Postgres holds the SACRED chat-services_postgres-data volume and
    # AGENTS.md requires explicit sign-off before touching it, even for a
    # non-destructive attribute like logging (`docker compose up` alone does
    # not reconfigure a running container — only a recreate does, and a
    # recreate of postgres is exactly the "don't fold it into a bulk
    # recreate" case). health-check-all.sh's log-policy assertion will
    # legitimately flag the live postgres container until this recreate is
    # explicitly approved and performed.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: ${TZ:-UTC}
      # Use a subdirectory of the mounted disk as PGDATA. Mounting the ext4
      # disk root directly fails initdb because of its lost+found directory.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /opt/nexaduo/postgres-data:/var/lib/postgresql/data
      - /opt/nexaduo/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - chat-network

  redis:
    image: redis:7.2.4-alpine
    restart: unless-stopped
    logging: *default-logging
    # Measured ~9MiB RSS. Given floor of 256m (not the bare 4x/128m floor
    # every other tiny service gets) because redis is the shared broker for
    # BOTH Sidekiq (chatwoot) and Celery (dify) plus a cache with
    # --maxmemory-policy allkeys-lru — a single-tenant idle sample
    # undersells its role under multi-tenant load.
    mem_limit: 256m
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - yes
      - --maxmemory-policy
      - allkeys-lru
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chat-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *default-logging
    # Measured ~22MiB RSS; 4x rounds under the 128m floor.
    mem_limit: 128m
    # Pin the metrics listener to a fixed loopback address/port (issue #158):
    # without an explicit --metrics, cloudflared still binds one from its
    # default port list (verified empirically: `cloudflared tunnel ready`
    # against the unpinned default succeeded), but pinning removes the
    # ambiguity of "whichever of 20241-20245 happened to be free" and gives
    # the healthcheck below a stable target. Loopback-only — not published as
    # a host port (host ports are isolated by default, #119/#145) and not
    # reachable from other containers on nexaduo-network either.
    command: tunnel --metrics 127.0.0.1:20241 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    # cloudflared's image is distroless (verified: no /bin/sh, no wget/curl —
    # `docker exec ... sh` fails with "executable file not found"), so the
    # healthcheck can't shell out to a probe tool. cloudflared ships its own
    # readiness subcommand for exactly this: `tunnel ready` calls the local
    # /ready endpoint on the metrics listener and returns a real exit code
    # (verified: exit 0 against the live metrics port, exit 1 + "connection
    # refused" against a wrong port) — this is the sole path available.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      # autoheal=true (issue #158): cloudflared is the ONLY path for all
      # public *.nexaduo.com traffic, so a tunnel that wedges (stays `Up`
      # while no longer proxying) is a total outage indistinguishable from
      # "fine" without this healthcheck. A `docker restart` reconnects the
      # tunnel in a few seconds — far cheaper than a wedge going unnoticed
      # until someone reports the site down. The probe above hits its own
      # /ready endpoint (not a bare TCP check), and retries=3/interval=30s
      # give ~90s of grace before autoheal acts, so a brief edge blip
      # doesn't trigger a restart loop.
      - "autoheal=true"
    networks:
      - chat-network

  # autoheal (issue #41): plain Docker Compose `restart:` policies react to a
  # container *exiting*, NOT to it going `unhealthy`. dify-api's failure mode is a
  # gunicorn master that stays UP with zero workers, so its own restart policy
  # never fires. autoheal watches every container labelled `autoheal=true` and
  # `docker restart`s it once Docker marks it unhealthy — turning the healthcheck
  # into an actual self-recovery loop. Only labelled containers are touched.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    logging: *default-logging
    # Measured ~4MiB RSS; 4x rounds under the 128m floor.
    mem_limit: 128m
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"        # seconds between unhealthy scans
      AUTOHEAL_START_PERIOD: "120"   # grace before autoheal starts acting
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - chat-network

volumes:
  postgres-data:
  redis-data:

networks:
  chat-network:
    external: true
    name: nexaduo-network
