# Issue #156: bounded logging is the default for every service (see the
# longer rationale in deploy/docker-compose.shared.yml — YAML anchors don't
# cross compose files, so each file carries its own copy of this block).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Noisy tier: chatwoot-sidekiq is the service that motivated this issue
# (measured ~54,810 lines / ~14.0MB in 15h ≈ 22MB/day — larger and faster
# than the #151 incident that forced rotation onto coolify-proxy in the first
# place). At the default 10m x 3 = 30MB, that's only ~1.4 days of local
# `docker logs` debugging window before rotation drops the oldest chunk.
# Bumped to 20m x 4 = 80MB ≈ 3.6 days: still bounded (never unrotated again),
# but keeps a useful multi-day local window for `docker logs`/`--since`
# debugging without relying solely on a Loki query. Loki/Promtail retains the
# FULL history regardless of this local buffer size — Promtail's docker_sd
# scrape streams each line to Loki as it's written (the same continuous-tail
# mechanism as `docker logs -f`), so rotation dropping old on-disk chunks
# does not shorten what's already been forwarded and indexed in Loki. Sized
# up specifically for this one noisy service rather than raising the
# stack-wide default, since every other service in this file/repo is 1-2
# orders of magnitude quieter (dify-plugin-daemon ~5.4MB/day, evolution-api
# ~1.3MB/day — the default 30MB already covers days-to-weeks for those).
x-logging-noisy: &noisy-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

services:
  chatwoot-init:
    image: chatwoot/chatwoot:v4.13.0-ce
    restart: "no"
    logging: *default-logging
    # One-shot db:prepare/migration task — same Rails boot as chatwoot-rails
    # but no steady-state web traffic, so a lower cap than the long-running
    # service (issue #157 "everything else" tier).
    mem_limit: 1024m
    environment:
      RAILS_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
    volumes:
      - ${NEXADUO_CONF_PATH}/deploy/ai_agents.rb:/app/config/initializers/ai_agents.rb:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "==> Running db:prepare (idempotent)";
        bundle exec rails db:prepare;
        echo "==> Clearing onboarding if admin exists";
        bundle exec rails r "Redis::Alfred.delete(Redis::Alfred::CHATWOOT_INSTALLATION_ONBOARDING) if User.where(type: 'SuperAdmin').exists?";
        echo "==> Chatwoot DB ready.";
    networks:
      - chat-network
  chatwoot-rails:
    image: chatwoot/chatwoot:v4.13.0-ce
    restart: unless-stopped
    logging: *default-logging
    # Issue #157: measured ~363MiB RSS (docker stats, 2026-08-07); limit =
    # 4x rounded up to the next 128MiB.
    mem_limit: 1536m
    depends_on:
      chatwoot-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CHATWOOT_FORCE_SSL: "false"
      FORCE_SSL: "false"
      # Trust the tunnel/Traefik forwarded https scheme so request.base_url is
      # https and the /super_admin CSRF Origin check passes (issue #95). This is
      # assume_ssl (no redirect), NOT force_ssl — no Cloudflare SSL redirect loop.
      RAILS_ASSUME_SSL: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL}
      OMNIAUTH_PROVIDERS: google_oauth2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatwoot.rule=Host(`${CHATWOOT_DOMAIN}`)"
      - "traefik.http.routers.chatwoot.entrypoints=http"
      - "traefik.http.services.chatwoot.loadbalancer.server.port=3000"
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-public:/app/public
      - ${NEXADUO_CONF_PATH}/deploy/ai_agents.rb:/app/config/initializers/ai_agents.rb:ro
      - ${NEXADUO_CONF_PATH}/deploy/assume_ssl.rb:/app/config/initializers/assume_ssl.rb:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "OmniAuth.config.allowed_request_methods = [:post, :get]" >> config/initializers/omniauth.rb
        exec docker/entrypoints/rails.sh bundle exec rails s -p 3000 -b 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - chat-network
  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v4.13.0-ce
    restart: unless-stopped
    # Noisy tier — see the x-logging-noisy rationale above (issue #156).
    logging: *noisy-logging
    # Issue #157 priority group 2 (background job runner, likeliest to
    # leak): measured ~495MiB RSS; limit = 4x rounded up to the next 128MiB.
    mem_limit: 2048m
    environment:
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      # FRONTEND_URL must be present in the Sidekiq process too: background
      # jobs (SendReplyJob, AutoAssignment::AssignmentJob, Devise::Mailer, ...)
      # build absolute URLs with no HTTP request context, so Rails derives
      # default_url_options[:host] / the ActionMailer host from FRONTEND_URL.
      # Without it Sidekiq raises "Missing host to link to!" (issue #83).
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      CHATWOOT_FORCE_SSL: "false"
      FORCE_SSL: "false"
      # Kept in parity with chatwoot-rails (issue #95); harmless in Sidekiq (no
      # rack requests) — background jobs derive https from FRONTEND_URL.
      RAILS_ASSUME_SSL: "true"
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-public:/app/public
      - ${NEXADUO_CONF_PATH}/deploy/ai_agents.rb:/app/config/initializers/ai_agents.rb:ro
      - ${NEXADUO_CONF_PATH}/deploy/assume_ssl.rb:/app/config/initializers/assume_ssl.rb:ro
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    # Queue-liveness probe, not a `pgrep` (issue #158): `sidekiqmon processes`
    # queries Sidekiq's own Redis-backed process registry, which a wedged
    # process (Ruby event loop stuck, still `Up` in Docker) stops
    # heartbeating to and drops out of within its TTL — a `pgrep sidekiq`
    # would still show the process and never catch that. Asserting our OWN
    # container's hostname is present in that registry (not just "some
    # process exists") catches the wedge. Verified inside the running
    # container: `bundle exec sidekiqmon processes` lists
    # `<hostname>:<pid>:<id> [app]`, completes in ~1s (no full Rails boot
    # needed), and $HOSTNAME (Docker's own container-id hostname) is a
    # substring of that line.
    healthcheck:
      test: ["CMD-SHELL", "cd /app && bundle exec sidekiqmon processes 2>&1 | grep -qF \"$$HOSTNAME\""]
      interval: 30s
      timeout: 15s
      retries: 5
      # Chatwoot's Rails boot is the same codebase as chatwoot-rails
      # (start_period: 90s there); Sidekiq boots the same Rails app, so
      # mirror that grace to avoid flapping unhealthy during a slow cold
      # start.
      start_period: 90s
    labels:
      # autoheal=true (issue #158): Sidekiq's job model is designed to
      # tolerate a restart — a job in flight during SIGTERM either finishes
      # within the graceful-shutdown window or is re-enqueued (Sidekiq's
      # at-least-once semantics; this is the same restart path an ordinary
      # deploy already exercises). A queue that stops draining while the
      # process stays `Up` (the exact case a `pgrep`-style check would miss)
      # is worse than a brief restart, so autoheal is warranted here.
      - "autoheal=true"
    networks:
      - chat-network
volumes:
  chatwoot-storage:
  chatwoot-public:
networks:
  chat-network:
    external: true
    name: nexaduo-network
