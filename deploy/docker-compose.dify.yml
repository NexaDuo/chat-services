# Dify Service Stack - Dynamic Environment Configurations
#
# Issue #156: bounded logging is the default for every service (see the
# longer rationale in deploy/docker-compose.shared.yml — YAML anchors don't
# cross compose files, so each file carries its own copy of this block).
# dify-plugin-daemon was one of the two services singled out in #156 by
# VOLUME (measured ~55,238 lines / ~3.4MB in 15h ≈ 5.4MB/day — a high LINE
# rate close to the #151 incident's, but a modest BYTE rate; the default 30MB
# already gives it ~5.5 days of local buffer on volume grounds alone).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Forensic tier (issue #156 `@rev` review): dify-sandbox and dify-plugin-daemon
# both execute LESS-TRUSTED code — dify-sandbox runs user-submitted workflow
# code, dify-plugin-daemon runs third-party plugin code (the same trust
# boundary AGENTS.md already calls out for the Traefik API exposure, #151
# `@sec`). An incident on either is disproportionately likely to need a wide
# forensic window regardless of today's measured volume, so both get the same
# bump as chatwoot-sidekiq (20m x 4 = 80MB) rather than staying at the
# volume-only default — investigative value here, not just accrual rate.
x-logging-forensic: &forensic-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

services:
  dify-init:
    image: alpine:3.19
    restart: "no"
    logging: *default-logging
    # One-shot chown; negligible footprint. 128m floor (issue #157).
    mem_limit: 128m
    volumes:
      - dify-api-storage:/app/api/storage
    command: chown -R 1001:1001 /app/api/storage
    networks:
      - chat-network
  dify-api:
    image: langgenius/dify-api:1.13.3
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 "everything else" tier: measured ~396MiB RSS; limit = 4x
    # rounded up to the next 128MiB.
    mem_limit: 1664m
    # Healthcheck for issue #41: after a redeploy/recreate the gunicorn master
    # sometimes binds :5001 but no workers boot ("Booting worker" never appears),
    # so the port accepts TCP but every request hangs (0 bytes -> edge 502).
    # /health is a Flask route SERVED BY A WORKER (returns {"pid","status","version"}),
    # so it fails exactly in the worker-less state — unlike a bare TCP probe.
    # NOTE: plain Compose `restart:` does NOT act on health status; the `autoheal`
    # sidecar in docker-compose.shared.yml watches `autoheal=true` containers and
    # restarts them when they go `unhealthy`, which recycles the worker-less master.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "8", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous cold-start grace: Dify runs Alembic migrations + gunicorn/gevent
      # boot on start. During start_period a failing probe does not mark unhealthy.
      start_period: 180s
    depends_on:
      dify-init:
        condition: service_completed_successfully
      dify-sandbox:
        condition: service_started
      dify-plugin-daemon:
        condition: service_started
      dify-ssrf-proxy:
        condition: service_started
    labels:
      # Recycled by the autoheal sidecar (docker-compose.shared.yml) when the
      # healthcheck below reports `unhealthy` — the #41 worker-less-master fix.
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.http.routers.dify-api.rule=Host(`${DIFY_DOMAIN}`) && (PathPrefix(`/v1`) || PathPrefix(`/console/api`) || PathPrefix(`/files`))"
      - "traefik.http.routers.dify-api.entrypoints=http"
      - "traefik.http.routers.dify-api.priority=20"
      - "traefik.http.services.dify-api.loadbalancer.server.port=5001"
    environment:
      MODE: api
      MIGRATION_ENABLED: "true"
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: postgres
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: ${POSTGRES_PASSWORD}
      PGVECTOR_DATABASE: dify
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${DIFY_SANDBOX_API_KEY}
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY}
      ENABLE_SOCIAL_OAUTH_LOGIN: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CONSOLE_API_URL: ${DIFY_CONSOLE_API_URL}
      CONSOLE_WEB_URL: ${DIFY_CONSOLE_API_URL}
      SERVICE_API_URL: ${DIFY_CONSOLE_API_URL}
      APP_API_URL: ${DIFY_APP_API_URL}
      APP_WEB_URL: ${DIFY_APP_API_URL}
      CONSOLE_OAUTH_REGISTRATION_ENABLED: "true"
      DIFY_LOG_LEVEL: INFO
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DIFY_API_ENABLE_METRICS: ${DIFY_API_ENABLE_METRICS:-false}
      INNER_API_METRICS_ENABLED: ${INNER_API_METRICS_ENABLED:-false}
      TRUSTED_PROXIES: "*"
      SERVER_WORKER_AMOUNT: "1"
    volumes:
      - dify-api-storage:/app/api/storage
    networks:
      - chat-network
  dify-worker:
    image: langgenius/dify-api:1.13.3
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 priority group 2 (background job runner, likeliest to
    # leak). Originally sized off a ~316MiB RSS sample taken on an idle
    # host (4x -> 1280m). `@rev` review on PR #164 caught that the LIVE
    # container had since grown to ~538MiB under real traffic — the actual
    # headroom over the 1280m limit had fallen to ~2.4x, not the intended
    # 4x, exactly the risk the idle-baseline sizing method warns about
    # (see shared.yml header). Re-measured and re-sized off the corrected
    # figure instead of just noting the drift: 538MiB x4 = 2152, rounded up
    # to the next 128MiB = 2176m. Longer-term detection for this class of
    # drift (idle-sized limit, real load grows past the multiple) is
    # tracked in issue #165 (OOMKilled/RestartCount alerting), since a
    # point-in-time re-measurement here doesn't prevent it recurring.
    mem_limit: 2176m
    environment:
      MODE: worker
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - dify-api-storage:/app/api/storage
    # Real liveness, not process existence (issue #158): `celery inspect
    # ping` round-trips through the broker to the worker's OWN event loop and
    # gets `pong` back — verified inside the running container (`celery -A
    # app.celery inspect ping --timeout 5` → "celery@<host>: OK / pong"). A
    # wedged worker (event loop stuck, process still `Up`) stops answering
    # this within the timeout, unlike a `pgrep celery` which would still see
    # the process.
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 15s
      retries: 5
      # Mirrors dify-api's 180s start_period (same image/boot path — Alembic
      # migration wait + Flask app init before the Celery app is importable).
      start_period: 180s
    # No autoheal=true (issue #158 — deliberate, not blanket): dify-worker
    # runs Dify's Celery tasks (document/RAG ingestion, dataset processing).
    # This session did not verify those tasks are safe to interrupt and
    # redeliver (acks_late/idempotency), and AGENTS.md is explicit that
    # restarting a worker mid-job can duplicate or lose work. Unlike
    # chatwoot-sidekiq (Sidekiq's at-least-once contract is well-established
    # in this codebase) or cloudflared (a stateless reconnect), the safer
    # default here is detection-only: the healthcheck above still surfaces a
    # wedge to `docker ps`/`health-check-all.sh`/an operator, who can decide
    # whether a restart is safe for whatever's mid-flight.
    networks:
      - chat-network
  dify-web:
    image: langgenius/dify-web:1.13.3
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 "everything else" tier: measured ~86MiB RSS; limit = 4x
    # rounded up to the next 128MiB.
    mem_limit: 384m
    environment:
      CONSOLE_API_URL: ${DIFY_CONSOLE_API_URL}
      APP_API_URL: ${DIFY_APP_API_URL}
      NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:-}
    # dify-web's Next.js server binds only to its own container IP, not
    # 127.0.0.1/0.0.0.0 (verified inside the running container: `netstat -tlnp`
    # shows `LISTEN` on the container's eth0 address only) — a bare
    # `wget http://127.0.0.1:3000/` therefore always connection-refuses even
    # when the app is fine. $$HOSTNAME resolves via Docker's own /etc/hosts
    # to that same address (verified: `wget http://$HOSTNAME:3000/` returns
    # the app's HTML). Root path is a real Next.js page render, not a TCP
    # accept-only check.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 5 http://$$HOSTNAME:3000/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dify.rule=Host(`${DIFY_DOMAIN}`)"
      - "traefik.http.routers.dify.entrypoints=http"
      - "traefik.http.routers.dify.priority=10"
      - "traefik.http.services.dify.loadbalancer.server.port=3000"
      # autoheal=true (issue #158): dify-web is a stateless Next.js frontend
      # with no job/queue state to duplicate or lose — a restart just drops
      # in-flight page loads, which the browser retries.
      - "autoheal=true"
    networks:
      - chat-network
  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.14
    restart: unless-stopped
    # Forensic tier — see x-logging-forensic rationale above (issue #156).
    logging: *forensic-logging
    # Issue #157 priority group 1 (highest blast-radius: executes
    # user-submitted, less-trusted workflow code). Measured baseline ~58MiB
    # RSS is a poor predictor of peak — a single code execution can spike
    # well above steady-state idle — so this gets an explicit floor (512m)
    # instead of the bare 4x-of-measured figure every other service uses,
    # plus a CPU cap (`cpus`) so a runaway/malicious execution can't spin the
    # host's CPU either, matching the same trust-boundary reasoning AGENTS.md
    # already applies to this container for the Traefik API exposure (#151).
    mem_limit: 512m
    cpus: "2"
    environment:
      API_KEY: ${DIFY_SANDBOX_API_KEY}
    networks:
      - chat-network
  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.5.3-local
    restart: unless-stopped
    # Forensic tier — see x-logging-forensic rationale above (issue #156).
    logging: *forensic-logging
    # Issue #157 priority group 1 (executes third-party plugin code, the
    # same less-trusted boundary as dify-sandbox above). Measured ~145MiB
    # RSS; limit = 4x rounded up to the next 128MiB, plus the same CPU cap
    # rationale as dify-sandbox.
    mem_limit: 640m
    cpus: "2"
    environment:
      SERVER_KEY: ${DIFY_PLUGIN_DAEMON_KEY}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: '${DIFY_PLUGIN_DIFY_INNER_API_KEY}'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: dify_plugin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PLUGIN_REMOTE_INSTALLING_HOST: "0.0.0.0"
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
    volumes:
      - dify-plugin-storage:/app/storage
    networks:
      - chat-network
  dify-ssrf-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    logging: *default-logging
    # Measured ~26MiB RSS; 4x rounds under the 128m floor.
    mem_limit: 128m
    networks:
      - chat-network
volumes:
  dify-api-storage:
  dify-plugin-storage:
networks:
  chat-network:
    external: true
    name: nexaduo-network
