# Issue #156: bounded logging is the default for every service (see the
# longer rationale in deploy/docker-compose.shared.yml — YAML anchors don't
# cross compose files, so each file carries its own copy of this block).
# evolution-api was measured at ~14,948 lines / ~820KB in 15h (~1.3MB/day) —
# the default 30MB buffer already covers ~23 days; no override needed.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  evolution-api:
    # Evolution API's official image moved to evoapicloud/* — atendai/evolution-api
    # now denies pulls and broke CI/redeploys. Same pinned version (v2.1.1).
    image: evoapicloud/evolution-api:v2.1.1
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 "everything else" tier: measured ~97MiB RSS; limit = 4x
    # rounded up to the next 128MiB.
    mem_limit: 512m
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY}'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: 'postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution'
      CACHE_REDIS_URI: 'redis://:${REDIS_PASSWORD}@redis:6379/2'
    volumes:
      - 'evolution-instances:/evolution/instances'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`${EVOLUTION_DOMAIN}`)"
      - "traefik.http.routers.evolution.entrypoints=http"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"
    networks:
      - chat-network
  middleware:
    image: '${MIDDLEWARE_IMAGE}'
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 "everything else" tier: measured ~51MiB RSS; limit = 4x
    # rounded up to the next 128MiB.
    mem_limit: 256m
    environment:
      PORT: 4000
      CHATWOOT_BASE_URL: http://chatwoot-rails:3000
      CHATWOOT_API_TOKEN: '${CHATWOOT_API_TOKEN}'
      CHATWOOT_WEBHOOK_TOKEN: '${CHATWOOT_WEBHOOK_TOKEN}'
      DIFY_BASE_URL: http://dify-api:5001/v1
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/middleware'
      HANDOFF_SHARED_SECRET: '${HANDOFF_SHARED_SECRET}'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD}'
      CHATWOOT_PLATFORM_TOKEN: '${CHATWOOT_PLATFORM_TOKEN}'
      EVOLUTION_AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY}'
      EVOLUTION_BASE_URL: http://evolution-api:8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.middleware.rule=Host(`${MIDDLEWARE_DOMAIN}`)"
      - "traefik.http.routers.middleware.entrypoints=http"
      - "traefik.http.services.middleware.loadbalancer.server.port=4000"
    networks:
      - chat-network
  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 priority group 3 (observability, grows with ingest volume
    # by design — given 6x headroom instead of the default 4x). Measured
    # ~69MiB RSS; limit = 6x rounded up to the next 128MiB.
    mem_limit: 512m
    user: "0"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      # Directory mount (not single-file) to survive the WSL stale-inode OCI
      # failure that killed the proxy/observability on host restart (#113/#116).
      - ${NEXADUO_CONF_PATH}/observability/loki:/etc/loki:ro
      - loki-data:/var/loki
    networks:
      - chat-network
  promtail:
    image: grafana/promtail:3.1.0
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 priority group 3 (observability, 6x headroom — see loki
    # above). Measured ~53MiB RSS; limit = 6x rounded up to the next 128MiB.
    mem_limit: 384m
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      # Directory mount (not single-file) — WSL stale-inode hardening (#113/#116).
      - ${NEXADUO_CONF_PATH}/observability/promtail:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - chat-network
  grafana:
    # Pinned to 11.6.16 (was 11.3.0). Grafana 11.3.0–11.4.0 ships an upstream bug
    # where the native `xychart` core panel is registered twice at startup:
    #   plugins.registration level=error msg="Could not register plugin"
    #     pluginId=xychart error="plugin xychart is already registered"
    # It is NOT caused by our provisioning (reproduces on a vanilla image with no
    # GF_INSTALL_PLUGINS / no dashboards) and is not silenceable via
    # GF_FEATURE_TOGGLES_DISABLE=autoMigrateXYChartPanel (a GA/stable toggle).
    # Fix requires >=11.6.0 — verified 0 occurrences on that line both vanilla and
    # with this provisioning mounted (issue #20). Pinned to the latest 11.6.x patch
    # (11.6.16, 2026-06-23) not the .0, to carry ~15 months of intervening security
    # fixes (@sec MEDIUM advisory on PR #130).
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 priority group 3 (observability, 6x headroom — see loki
    # above). Measured ~98MiB RSS; limit = 6x rounded up to the next 128MiB.
    mem_limit: 640m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_PASSWORD}'
      GF_AUTH_GOOGLE_ENABLED: "true"
      GF_AUTH_GOOGLE_CLIENT_ID: '${GOOGLE_ID}'
      GF_AUTH_GOOGLE_CLIENT_SECRET: '${GOOGLE_SECRET}'
      GF_AUTH_GOOGLE_SCOPES: "openid email profile"
      GF_AUTH_GOOGLE_AUTH_URL: "https://accounts.google.com/o/oauth2/v2/auth"
      GF_AUTH_GOOGLE_TOKEN_URL: "https://oauth2.googleapis.com/token"
      GF_AUTH_GOOGLE_ALLOWED_DOMAINS: "nexaduo.com machado.cc"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: postgres
      GF_DATABASE_PASSWORD: '${POSTGRES_PASSWORD}'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=http"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    volumes:
      - ${NEXADUO_CONF_PATH}/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - chat-network
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 priority group 3 (observability, 6x headroom — see loki
    # above). Measured ~49MiB RSS; limit = 6x rounded up to the next 128MiB.
    mem_limit: 384m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      # Directory mount (not single-file) — WSL stale-inode hardening (#113/#116).
      # The command only references --config.file (no default consoles), so
      # shadowing /etc/prometheus with our config dir is safe.
      - ${NEXADUO_CONF_PATH}/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - chat-network
  self-healing-agent:
    image: '${SELF_HEALING_IMAGE}'
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 "everything else" tier: measured ~31MiB RSS; 4x rounds
    # under the 128m floor.
    mem_limit: 128m
    environment:
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/self_healing'
      LOKI_URL: http://loki:3100
      MIDDLEWARE_URL: http://middleware:4000
      # Required to authenticate against the Middleware Config API (GET
      # /config) and obtain dify.selfHealingApiKey — without it the agent
      # never gets LLM analysis (issue #152; middleware receives the same
      # var above). Left unset (or a var interpolated as empty), the agent
      # now fails loud instead of silently degrading to detection-only.
      HANDOFF_SHARED_SECRET: '${HANDOFF_SHARED_SECRET}'
      # SELF_HEALING_ALLOW_NO_CONFIG is intentionally NOT set here: production
      # must fail loud on a missing/unusable secret (issue #152). Only CI
      # (deploy/docker-compose.ci.yml) opts in explicitly.
    networks:
      - chat-network
  otel-collector:
    # Single OTLP collector on chat-network: Node apps push traces here
    # (otel-collector:4318), Dify pushes OTLP metrics; metrics → Prometheus
    # scrape (:8889), traces → Tempo (:4317).
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 priority group 3 (observability, 6x headroom — see loki
    # above). Measured ~49MiB RSS; limit = 6x rounded up to the next 128MiB.
    mem_limit: 384m
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      # Directory mount (not single-file) — WSL stale-inode hardening (#113/#116).
      - ${NEXADUO_CONF_PATH}/observability/otel-collector:/etc/otelcol-contrib:ro
    networks:
      - chat-network
  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    logging: *default-logging
    # Issue #157 priority group 3 (observability, 6x headroom — see loki
    # above). Measured ~128MiB RSS; limit = 6x rounded up to the next
    # 128MiB (already an exact multiple).
    mem_limit: 768m
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      # Directory mount (not single-file) — WSL stale-inode hardening (#113/#116).
      - ${NEXADUO_CONF_PATH}/observability/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    networks:
      - chat-network
volumes:
  evolution-instances:
  loki-data:
  grafana-data:
  prometheus-data:
  promtail-data:
  tempo-data:
networks:
  chat-network:
    external: true
    name: nexaduo-network
